services:
  - type: web
    name: wangung-hanaro-shift-planner
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: hanaro-shift-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /var/data
      - key: SEED_DATABASE_PATH
        value: deployment/shift-planner.sqlite
      - key: COOKIE_SECURE
        value: "true"
